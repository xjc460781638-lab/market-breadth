name: Market analytics
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [bootstrap, intraday, final, sync]
        default: bootstrap
      dry_run:
        type: boolean
        default: false
  schedule:
    - cron: "35,40,45,50,55 1 * * 1-5"
    - cron: "*/5 2,5,6 * * 1-5"
    - cron: "0,5,10,15,20,25,30 3 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "47 8,12 * * 1-5"
permissions:
  contents: write
concurrency:
  group: market-analytics
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      SITE_URL: ${{ secrets.SITE_URL }}
      SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
      SITE_SERVICE_TOKEN: ${{ secrets.SITE_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python -m unittest collector.test_analytics -v
      - uses: actions/cache/restore@v4
        with:
          path: .cache/analytics.json
          key: analytics-${{ github.run_id }}
          restore-keys: analytics-
      - name: Collect independent modules and verify readback
        id: collect
        env:
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          MODE="${INPUT_MODE:-intraday}"
          if [ "$SCHEDULE" = '47 8,12 * * 1-5' ]; then MODE=final; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          python -m collector.analytics --mode "$MODE" $([ "$DRY_RUN" = 'true' ] && echo --no-publish)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/analytics.json
          key: analytics-${{ github.run_id }}
      - name: Commit daily actual observations
        if: steps.collect.outputs.mode == 'bootstrap' || steps.collect.outputs.mode == 'final'
        run: |
          if [ "$(python -m collector.analytics_changed)" = 'unchanged' ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analytics.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update market analytics'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Report source failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/analytics.json').read_text())
          failed=[key for key in ['turnover','flow','margin'] if report[key]['status']!='ok']
          if failed: raise SystemExit('Source unavailable; last valid data retained: '+', '.join(failed))
          PY

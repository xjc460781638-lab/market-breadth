name: Board data
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [bootstrap, intraday, final]
        default: bootstrap
      dry_run:
        type: boolean
        default: false
  schedule:
    - cron: "35,40,45,50,55 1 * * 1-5"
    - cron: "*/5 2,5,6 * * 1-5"
    - cron: "0,5,10,15,20,25,30 3 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "57 8 * * 1-5"
permissions:
  contents: write
concurrency:
  group: board-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      SITE_URL: ${{ secrets.SITE_URL }}
      SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
      SITE_SERVICE_TOKEN: ${{ secrets.SITE_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/boards
          key: boards-${{ github.run_id }}
          restore-keys: boards-
      - name: Board flow collection
        id: flows
        continue-on-error: true
        env:
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          MODE="${INPUT_MODE:-intraday}"
          if [ "$SCHEDULE" = '57 8 * * 1-5' ]; then MODE=final; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          python -m collector.board_flows --mode "$MODE" $([ "$DRY_RUN" = 'true' ] && echo --no-publish)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/boards
          key: boards-${{ github.run_id }}
      - name: Save daily actual board results
        if: always() && (steps.flows.outputs.mode == 'bootstrap' || steps.flows.outputs.mode == 'final')
        run: |
          if [ ! -d data/boards ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boards
          if ! git diff --cached --quiet; then
            git commit -m 'data: update board flows'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Signal incomplete collection
        if: steps.flows.outcome == 'failure'
        run: exit 1

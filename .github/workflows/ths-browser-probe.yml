name: Tonghuashun browser trial
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ths-browser-trial
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest collector.test_ths_browser_probe
      - run: python -m collector.ths_browser_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ths-browser-evidence
          path: .probe/ths/
          retention-days: 3
          if-no-files-found: warn

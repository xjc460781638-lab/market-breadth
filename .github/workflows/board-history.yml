name: Historical board flows
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1-5'
permissions:
  contents: write
concurrency:
  group: historical-board-flows
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      SITE_URL: ${{ secrets.SITE_URL }}
      SITE_INGEST_TOKEN: ${{ secrets.SITE_INGEST_TOKEN }}
      SITE_SERVICE_TOKEN: ${{ secrets.SITE_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python -m collector.board_history
      - if: always()
        run: |
          if [ ! -d data/boards/history ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boards/history
          if ! git diff --cached --quiet; then
            git commit -m 'data: backfill daily board flows'
            git pull --rebase origin main
            git push
          fi
